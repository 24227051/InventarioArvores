<div class="container mt-4" style="max-width:420px">
  <h3 class="mb-4">Entrar</h3>

  <div *ngIf="error" class="alert alert-danger">{{ error }}</div>

  <form (ngSubmit)="submit()">
    <div class="mb-3">
      <label class="form-label">Email</label>
      <input [(ngModel)]="model.email" name="email" type="email" class="form-control" required />
    </div>

    <div class="mb-3">
      <label class="form-label">Senha</label>
      <input [(ngModel)]="model.password" name="password" type="password" class="form-control" required />
    </div>

    <button class="btn btn-primary w-100" type="submit">Entrar</button>
  </form>

  <div class="mt-3 text-center">
    <a routerLink="/register">Criar conta</a>
  </div>
</div>
