<div class="container mt-4" style="max-width:480px">
  <h3 class="mb-4">Registrar</h3>

  <div *ngIf="loading" class="alert alert-info d-flex align-items-center">
    <div class="spinner-border me-2" role="status" aria-hidden="true"></div>
    <div>Aguarde — conectando ao servidor. Pode demorar na primeira requisição.</div>
  </div>

  <div *ngIf="error" class="alert alert-danger">{{ error }}</div>
  <div *ngIf="success" class="alert alert-success">{{ success }}</div>

  <form (ngSubmit)="submit()">
    <div class="mb-3">
      <label class="form-label">Email</label>
      <input [(ngModel)]="model.email" name="email" type="email" class="form-control" required [disabled]="loading" />
    </div>

    <div class="mb-3">
      <label class="form-label">Senha</label>
      <input [(ngModel)]="model.password" name="password" type="password" class="form-control" required [disabled]="loading" />
    </div>

    <div class="mb-3">
      <label class="form-label">Confirmar Senha</label>
      <input [(ngModel)]="model.confirmPassword" name="confirmPassword" type="password" class="form-control" required [disabled]="loading" />
    </div>

    <button class="btn btn-primary w-100" type="submit" [disabled]="loading">
      <span *ngIf="loading" class="spinner-border spinner-border-sm me-2" role="status" aria-hidden="true"></span>
      Registrar
    </button>
  </form>

  <div class="mt-3 text-center">
    <a routerLink="/login">Já tenho conta</a>
  </div>
</div>
